# Схемы событий ситуационного центра — кейс 4
# Не REST API, а JSON-схемы входа (от датчиков и приложения)
# Проверить на https://www.jsonschemavalidator.net/

$schema: "https://json-schema.org/draft/2020-12/schema"
title: SituationCenterEvents
description: Набор JSON-схем контрактов событий для ситуационного центра птицефабрики

definitions:

  TelemetryEvent:
    type: object
    required: [event_id, time, location, indicator, value]
    additionalProperties: false
    properties:
      event_id:
        type: string
        pattern: '^evt_[A-Za-z0-9]{6,32}$'
      time:
        type: string
        format: date-time
      location:
        type: string
        pattern: '^site_[0-9]{2}$'
      indicator:
        type: string
        enum: [temperature, humidity, ventilation]
      value:
        type: number
      signature:
        type: string
        description: HMAC-SHA256 подпись события (защита от подмены)

  IncidentEvent:
    type: object
    required: [incident_id, type, location, time, status]
    additionalProperties: false
    properties:
      incident_id:
        type: string
        pattern: '^inc_[0-9]{3}$'
        description: Уникальный идентификатор инцидента
      type:
        type: string
        enum: [temperature, ventilation, humidity, equipment, other]
        description: Категория инцидента
      location:
        type: string
        pattern: '^site_[0-9]{2}$'
        description: Идентификатор площадки из справочника sites.csv
      time:
        type: string
        format: date-time
        description: Время регистрации инцидента (ISO 8601)
      responsible:
        type: [string, "null"]
        description: Табельный ID ответственного инженера (null для статуса NEW)
      status:
        type: string
        enum: [NEW, ASSIGNED, IN_PROGRESS, CLOSED]
        description: Текущий статус жизненного цикла
      source:
        type: string
        enum: [mobile, sensor, auto]
        description: Канал поступления инцидента

  AlertEvent:
    type: object
    required: [alert_id, severity, at]
    additionalProperties: false
    properties:
      alert_id:
        type: string
        pattern: '^alrt_[0-9]{4}$'
        description: Уникальный идентификатор оповещения
      measurement_id:
        type: string
        description: Внешний ключ (FK) на сущность Measurement
      severity:
        type: string
        enum: [WARNING, CRITICAL, STALE]
        description: Расчётный уровень критичности
      action:
        type: string
        enum: [ALERT_CREATED, ESCALATED, DUPLICATE]
        description: Выполненное системой действие по правилам A-1...A-5
      at:
        type: string
        format: date-time
        description: Временная метка формирования оповещения (ISO 8601)

  TransitionRequest:
    type: object
    required: [incident_id, to, actor]
    additionalProperties: false
    properties:
      incident_id:
        type: string
        pattern: '^inc_[0-9]{3}$'
        description: ID инцидента, для которого запрашивается переход
      to:
        type: string
        enum: [ASSIGNED, IN_PROGRESS, CLOSED]
        description: Целевой статус инцидента
      actor:
        type: string
        description: Роль или идентификатор сотрудника (например, e_101)
      comment:
        type: [string, "null"]
        description: Комментарий или код причины закрытия (например, NO_ACTION)

  Error:
    type: object
    required: [error_code, message]
    additionalProperties: false
    properties:
      error_code:
        type: string
        enum:
          - VALIDATION_ERROR
          - UNKNOWN_LOCATION
          - INVALID_TRANSITION
          - DUPLICATE_EVENT
          - SENSOR_SIGNATURE_INVALID
        description: Машиночитаемый код ошибки
      message:
        type: string
        description: Человекочитаемое описание причины отказа
      retryable:
        type: boolean
        description: Признак возможности повторной отправки запроса
      details:
        type: object
        description: Дополнительный контекст ошибки

examples:

  valid_telemetry:
    event_id: evt_ab12cd
    time: "2025-11-01T08:00:00Z"
    location: site_01
    indicator: temperature
    value: 28.3
    signature: "hmac:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"

  valid_incident:
    incident_id: inc_001
    type: temperature
    location: site_01
    time: "2025-11-01T08:00:00Z"
    responsible: null
    status: NEW
    source: sensor

  invalid_location:
    incident_id: inc_999
    type: temperature
    location: site_99
    time: "2025-11-01T08:00:00Z"
    status: NEW

  invalid_transition:
    incident_id: inc_001
    to: CLOSED
    actor: e_101